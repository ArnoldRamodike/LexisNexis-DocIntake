version: "3.9"

services:
  doc-intake:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - doc-storage:/app/doc-storage
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Storage__LocalPath=/app/doc-storage
    restart: unless-stopped

volumes:
  doc-storage:
